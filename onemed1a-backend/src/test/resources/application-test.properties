# In-memory H2 just for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Let JPA build/drop schema each test context
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Make sure nothing external interferes
spring.sql.init.mode=never
spring.flyway.enabled=false

tmdb.movie.url=https://api.themoviedb.org/3/discover/movie
tmdb.tv.url=https://api.themoviedb.org/3/discover/tv
tmdb.bearer.token=dummy-tmdb-token

spotify.search.url=https://api.spotify.com/v1/search
spotify.token.url=https://accounts.spotify.com/api/token
spotify.client.id=dummy-client-id
spotify.client.secret=dummy-client-secret

google.books.uri=https://www.googleapis.com/books/v1/volumes
google.books.api.key=dummy-google-key
open.api.key=dummy-openai-key

jwt.secret=test-secret-please-be-long-enough-32chars
jwt.expiration=3600000